<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Assessment</title>
<link rel="stylesheet" href="assessment.css">

<style>
/* =========================
   BLUE ENROLL STATUS
========================= */
.enroll-status {
  margin: 12px 0;
  padding: 12px 16px;
  border-radius: 8px;
  font-weight: 600;
  text-align: center;
  display: none;
}

.enroll-status.success {
  display: block;
  background-color: #dbeafe;
  color: #1e3a8a;
  border: 1px solid #93c5fd;
}
</style>

</head>

<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="logo-title">
    <img src="logo .png">
    <h2>Partido State University</h2>
  </div>
</div>

<!-- YELLOW BAR -->
<div class="yellow-bar">

  <div style="display:flex; align-items:center; gap:10px;">
    <button class="menu-btn" onclick="toggleMenu()">☰</button>
    <h3>Assessment</h3>
  </div>

</div>

<!-- MAIN CONTENT -->
<div id="assessment" class="tab-content">

  <div class="container">

    <!-- FILTERS -->
    <div class="filters">

      <!-- LEFT SIDE INFO -->
      <div class="left-info">
        <span>
          Name:
          <b id="First_name"></b>
        </span>

        <span>
          Course & Year:
          <b id="courseYear"></b>
        </span>

        <span>
          Dept:
          <b id="department"></b>
        </span>

        <span>
          Validated:
          <b id="validated"></b>
        </span>
      </div>

      <!-- RIGHT BUTTON -->
      <button id="actionBtn"
              class="enroll-btn"
              onclick="handleEnroll()">
        Enroll
      </button>

    </div>

    <!-- ✅ BLUE STATUS MESSAGE ADDED HERE -->
    <div id="enrollStatus" class="enroll-status"></div>

    <!-- MESSAGE -->
    <p id="enrollMessage" class="enroll-message"></p>

    <!-- SUBJECT HEADER -->
    <div class="subject-header">

      <p class="subtitle">
        Enrolled Subjects:
      </p>

      <div class="period-box">
        <label>Period:</label>

        <select id="period">
          <option>Loading...</option>
        </select>
      </div>

    </div>

    <!-- TABLE -->
    <table>

      <thead>
        <tr>
          <th>Code</th>
          <th>Subject</th>
          <th>Description</th>
          <th>Units</th>
          <th>Schedule</th>
          <th>Instructor</th>
          <th>Section</th>
        </tr>
      </thead>

      <tbody id="scheduleTable"></tbody>

      <tfoot>
        <tr>

          <td colspan="3"
              style="text-align:right;font-weight:bold;">
            Total Units:
          </td>

          <td style="font-weight:bold;">
            <span id="totalUnits">0</span>
          </td>

          <td colspan="4"></td>

        </tr>
      </tfoot>

    </table>

  </div>

</div>

<!-- MODAL -->
<div id="modalOverlay" class="overlay hidden">

  <div class="modal">

    <p class="modal-text">
      <b>Are you sure you want to Enroll?</b>
      <br>
      Click "Proceed" if yes.
    </p>

    <div class="modal-buttons">

      <button class="cancel-btn"
              onclick="goBack()">
        Cancel
      </button>

      <button class="proceed-btn"
              onclick="confirmEnroll()">
        Proceed
      </button>

    </div>

  </div>

</div>

<script src="assessment.js"></script>

</body>
</html>
